name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches VERSION and a dated CHANGELOG release
        run: python scripts/versioning.py --check-tag "$GITHUB_REF_NAME"
      - name: Run the repository check set
        run: python scripts/check.py
      - name: Build the archive and checksum
        run: python scripts/package.py --output "$RUNNER_TEMP/release"
      - name: Attest build provenance for the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*.zip
      - name: Extract the release notes from CHANGELOG
        run: python scripts/versioning.py --notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP"/release/*.zip "$RUNNER_TEMP"/release/*.sha256
          --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
